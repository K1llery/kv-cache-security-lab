# exp_010: 方向 S 第 1–3 天——同 salt 同长度密文互换的端到端后果（评审+用户判定标准）
# 首要判据（用户 2026-09-27 指定）：
#   同 salt、同长度、不同对象的密文互换后，
#   (a) 确认本请求确实从 L2 取回该对象（请求 id + 服务端 (0 L1, N L2) 断言 + 磁盘哈希链）；
#   (b) 与无缓存重算比较 KV 状态及确定性输出：
#       装置设计使"互换后状态"与"诚实请求 P_C"完全一致（共享前 768 token 去重 +
#       最后一块互换 + 两 prompt 最后 token 相同），故可要求 O_B_swap == O_C_hit 逐字符串相等，
#       且 != O_B_true / O_B_hit。
# 对照（应被拒绝）：翻 1 字节（InvalidTag→重算）、截断 64 字节（malformed→重算）；
#   恢复互换后输出应回到 O_B_true（因果可逆）。
# 参数来源：
#   user_directive_20260927 = 本次工作单（首要判据与对照）
#   exp003_verified  = engine_driven 组合（engine_driven、L1=2GB、util=0.35、AES-128-GCM、hkdf(salt)）
#   exp008_method    = 逐请求断言/等待落盘/预热标记方法
model: /home/mr/projects/科研训练2.0/experiments/models/Qwen2.5-0.5B-Instruct
transfer_mode: engine_driven
l1_size_gb: 2
gpu_mem_util: 0.35
prompt_tokens: 1024          # 4 chunks × 256
shared_prefix_tokens: 768    # P_B 与 P_C 共享（chunk 0-2 去重）
salt: "swapsalt"             # 攻击对使用同一 salt（攻击前提）
reps_per_target: 2           # 每目标 2 次 × 4 目标 = 8 次互换请求（v1 参数误写 5，已按实际执行修正）
control_reps: 3              # 翻字节/截断对照
max_tokens: 24
temperature: 0.0
assertions:
  hit: "请求 id 的 Prefetch 行 (0 L1, 4 L2)"
  recompute: "无 retained>0 的 Prefetch 行"
  swap_primary: "对齐试验输出==O_C_hit（确定性）且所有试验 != O_B_true/O_B_hit；块序号由哈希配方标定（对齐集={2,3}，chunk3 状态等价成立）"
  controls: "翻字节/截断 → 服务端 InvalidTag/malformed + 重算 + O == O_B_true"
verdict_rule: "5/5 swap reps 静默错用（==O_C_hit 且 !=O_B_true）→ S 通过关口进入修复设计；否则按用户指示不自动转 F，先核实 F 的故障放大/策略错配"
