# exp_011: 单变量 AAD 修复实验（评审意见 2026-09-27 晚 第 2 项）
# 唯一变量：serde 从 "aesgcm"（AAD=None）换为 "aesgcm_aad"（新增模块，
# 位于 upstream/LMCache/lmcache/v1/distributed/serde/aesgcm_aad.py —— 本仓库
# 对固定提交的唯一源码增改，帧格式/密钥派生/异步处理与上游完全一致）。
# AAD = 规范编码(域名, 模型名, kv_rank, object_group_id, chunk_hash, cache_salt, 明文长度)；
# 解密端身份来自请求的 ObjectKey 与自身目标缓冲区长度，不从密文或盘上文件取得。
# 旧缓存处理：无 AAD 帧在新 serde 下验证失败 → 加载 miss → 重算（选择"失效重算"，
# 不做迁移）；组件级旧帧拒绝在本脚本内直接验证。
# 验收条件（用户指定）：
#   A1 诚实缓存仍可完整命中（(0 L1, 4 L2) + 输出 == 无缓存基线）
#   A2 exp_010 的全部有效密文互换（4 目标 × 2 reps）都被拒绝，输出回到无缓存基线
#   A3 翻字节、截断继续安全回退（拒绝 + 输出 == 基线）
model: /home/mr/projects/科研训练2.0/experiments/models/Qwen2.5-0.5B-Instruct
serde: aesgcm_aad
transfer_mode: engine_driven
l1_size_gb: 2
gpu_mem_util: 0.35
prompt_tokens: 1024
shared_prefix_tokens: 768
salt: "swapsalt2"          # 新测试密钥/新 salt（本轮随机生成 master.key，不入库）
reps_per_target: 2
control_reps: 2
max_tokens: 24
aad_encoding: "LMCACHE-AAD-v1 || len(model)||len(rank i32)||len(group i64)||len(chunk_hash)||len(salt)||len(pt_len u64)"
old_cache_policy: invalidate_and_recompute
sources:
